                {/* BRAND COL */}
                <div class="space-y-4 md:col-span-1">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-brand-terracotta text-white flex items-center justify-center font-bold text-sm">
                      M
                    </div>
                    <span class="text-white font-bold tracking-tight">Marian Montilla</span>
                  </div>
                  <p class="text-xs text-stone-400 italic leading-relaxed">
                    "Ser creativa y encontrar nuevas formas de resolver problemas."
                  </p>
                </div>

                {/* NAVIGATION COL */}
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-white uppercase tracking-wider">Páginas</h4>
                  <ul class="space-y-2 text-xs">
                    <li><button onClick={() => navigateTo('del-caos-al-foco')} class="hover:text-white transition-colors">Del Caos al Foco</button></li>
                    <li><button onClick={() => navigateTo('podcast')} class="hover:text-white transition-colors">Podcast</button></li>
                    <li><button onClick={() => navigateTo('recursos')} class="hover:text-white transition-colors">Recursos</button></li>
                    <li><button onClick={() => navigateTo('arquitectura')} class="hover:text-white transition-colors">Arquitectura de Sistemas</button></li>
                  </ul>
                </div>

                {/* SOCIAL NETWORKS */}
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-white uppercase tracking-wider">Redes Sociales</h4>
                  <ul class="space-y-2 text-xs text-stone-400">
                    <li><a href="https://www.instagram.com/bellarulox" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">Instagram (@bellarulox)</a></li>
                    <li><a href="https://www.tiktok.com/@bellarulox" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">TikTok (@bellarulox)</a></li>
                    <li><a href="https://www.threads.com/@bellarulox" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">Threads (@bellarulox)</a></li>
                    <li><a href="https://www.youtube.com/@MarianMOnline" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">YouTube (@MarianMOnline)</a></li>
                    <li><a href="https://www.linkedin.com/in/marianmontilla/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">LinkedIn (@marianmontilla)</a></li>
                  </ul>
                </div>

                {/* CONTACT */}
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-white uppercase tracking-wider">Contacto Directo</h4>
                  <p class="text-xs text-stone-400">
                    Escríbeme para colaboraciones o dudas directas:
                  </p>
                  <a href="mailto:marianm@bellarulox.com" class="text-xs text-amber-400 font-semibold hover:underline block">
                    marianm@bellarulox.com
                  </a>
                </div>

              </div>

              <div class="border-t border-stone-800 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-stone-500 gap-4">
                <p>&copy; {new Date().getFullYear()} Marian Montilla · Bellarulox. Todos los derechos reservados.</p>
                <p>Ecuador & Venezuela · Trabajo 100% remoto</p>
              </div>

            </div>
          </footer>

          {/* =========================================================
             MODAL: CALCULADORA INTERACTIVA DEMO
             ========================================================= */}
          {showCalcModal && (
            <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button 
                  onClick={() => setShowCalcModal(false)}
                  class="absolute top-5 right-5 text-stone-400 hover:text-stone-800 p-1 cursor-pointer"
                >
                  <Icon name="x" className="w-6 h-6" />
                </button>

                <div class="space-y-2">
                  <span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">Demo interactiva</span>
                  <h3 class="text-2xl font-bold text-stone-900">Calculadora Bellarulox</h3>
                  <p class="text-xs text-stone-500">
                    Calcula tu tarifa mínima por hora basada en tus ingresos deseados y tus horas facturables reales.
                  </p>
                </div>

                <div class="space-y-4 text-xs sm:text-sm">
                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Ingreso neto mensual deseado ($ USD):</label>
                    <input 
                      type="number" 
                      value={calcData.desiredIncome}
                      onChange={(e) => setCalcData({...calcData, desiredIncome: e.target.value})}
                      class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-brand-terracotta"
                    />
                  </div>

                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Gastos fijos mensuales del negocio ($ USD):</label>
                    <input 
                      type="number" 
                      value={calcData.fixedExpenses}
                      onChange={(e) => setCalcData({...calcData, fixedExpenses: e.target.value})}
                      class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-brand-terracotta"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block font-semibold text-stone-700 mb-1">Horas vendibles / sem:</label>
                      <input 
                        type="number" 
                        value={calcData.weeklyHours}
                        onChange={(e) => setCalcData({...calcData, weeklyHours: e.target.value})}
                        class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-brand-terracotta"
                      />
                    </div>
                    <div>
                      <label class="block font-semibold text-stone-700 mb-1">Semanas vacación / año:</label>
                      <input 
                        type="number" 
                        value={calcData.vacationWeeks}
                        onChange={(e) => setCalcData({...calcData, vacationWeeks: e.target.value})}
                        class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-brand-terracotta"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Margen para impuestos y ahorro (%):</label>
                    <input 
                      type="number" 
                      value={calcData.taxPercent}
                      onChange={(e) => setCalcData({...calcData, taxPercent: e.target.value})}
                      class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-brand-terracotta"
                    />
                  </div>
                </div>

                {/* RESULT BOX */}
                <div class="bg-amber-50 border border-amber-300 p-5 rounded-2xl text-center space-y-1">
                  <span class="text-xs text-amber-800 font-bold uppercase tracking-wider block">Tu Tarifa Mínima Recomendada</span>
                  <div class="text-3xl font-extrabold text-stone-900">
                    ${calculateRate()} USD <span class="text-xs font-normal text-stone-600">/ hora</span>
                  </div>
                  <p class="text-[11px] text-stone-500 pt-1">
                    Esta es la base para no perder dinero ni quemarte trabajando sin margen real.
                  </p>
                </div>

                <div class="text-center pt-2">
                  <button 
                    onClick={() => { setShowCalcModal(false); navigateTo('del-caos-al-foco'); }}
                    class="bg-brand-terracotta hover:bg-orange-700 text-white font-bold text-xs py-3 px-6 rounded-xl transition-colors cursor-pointer"
                  >
                    Aprende a estructurar precios en la comunidad &rarr;
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* =========================================================
             MODAL: BOOKING B2B CALL
             ========================================================= */}
          {showBookingModal && (
            <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
                <button 
                  onClick={() => setShowBookingModal(false)}
                  class="absolute top-5 right-5 text-stone-400 hover:text-stone-800 p-1 cursor-pointer"
                >
                  <Icon name="x" className="w-6 h-6" />
                </button>

                <div class="space-y-2">
                  <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">Consultoría B2B</span>
                  <h3 class="text-2xl font-bold text-stone-900">Agenda tu Llamada de Diagnóstico</h3>
                  <p class="text-xs text-stone-500">
                    Analicemos juntos el cuello de botella de tu operación y cómo estructurar tus sistemas.
                  </p>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); alert('¡Gracias! Me pondré en contacto contigo a la brevedad.'); setShowBookingModal(false); }} class="space-y-4 text-xs sm:text-sm">
                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Nombre completo:</label>
                    <input required type="text" placeholder="Tu nombre" class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-stone-900" />
                  </div>
                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Correo electrónico:</label>
                    <input required type="email" placeholder="tu@negocio.com" class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-stone-900" />
                  </div>
                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">Sitio web o Red social de tu empresa:</label>
                    <input required type="text" placeholder="https://..." class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-stone-900" />
                  </div>
                  <div>
                    <label class="block font-semibold text-stone-700 mb-1">¿Cuál es el mayor obstáculo operacional hoy?:</label>
                    <textarea required rows="3" placeholder="Ej. 'Dependen de mí para cada aprobación de entrega...'" class="w-full border border-stone-300 rounded-xl p-2.5 text-stone-900 focus:outline-none focus:border-stone-900"></textarea>
                  </div>

                  <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3.5 rounded-xl transition-colors cursor-pointer">
                    Solicitar Diagnóstico Estratégico
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
